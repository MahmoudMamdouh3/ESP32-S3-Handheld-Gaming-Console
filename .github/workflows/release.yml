name: Release firmware builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release-firmware:
    name: Build release firmware bundles
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.lock

      - name: Install Python verification tools
        run: python -m pip install --disable-pip-version-check -r requirements.lock

      - name: Run static checks and link verification
        run: python tasks.py check --no-tests --strict-lint

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@b82ff2bde1fb8fbbe4abfd3a041cd2ff675dc0dc # v2.0.0
        with:
          version: 1.6.0

      - name: Cache Arduino cores, libraries, and compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
            build
          key: ${{ runner.os }}-arduino-rel-${{ hashFiles('firmware/BmoGameboy/sketch.yaml') }}
          restore-keys: |
            ${{ runner.os }}-arduino-rel-
            ${{ runner.os }}-arduino-

      - name: Install pinned ESP32 core and libraries from sketch.yaml
        run: python tasks.py setup --no-hooks --no-pip

      - name: Compile profiles (verify default/no-doom build health; package redistributable MIT bundle)
        run: |
          python tasks.py build --profile default --warnings strict --fail-on-warnings
          python tasks.py size --elf build/target-compile/BmoGameboy.ino.elf --check-budgets
          python tasks.py build --profile no-doom --warnings strict --fail-on-warnings
          python tasks.py build --profile mit --warnings strict --fail-on-warnings

      - name: Package redistributable MIT binary, partition table, notices, and SHA-256 checksums
        run: |
          mkdir -p dist
          out="dist/bmo-handheld-esp32s3-mit"
          mkdir -p "${out}"
          cp "build/profile-mit/BmoGameboy.ino.bin" "${out}/"
          cp "build/profile-mit/BmoGameboy.ino.bootloader.bin" "${out}/"
          cp "build/profile-mit/BmoGameboy.ino.partitions.bin" "${out}/"
          cp "build/profile-mit/BmoGameboy.ino.elf" "${out}/"
          cp "build/profile-mit/BmoGameboy.ino.map" "${out}/"
          cp "firmware/BmoGameboy/partitions.csv" "${out}/"
          cp LICENSE THIRD_PARTY_NOTICES.md "${out}/"
          tar -czf "dist/bmo-handheld-esp32s3-mit.tar.gz" -C dist "bmo-handheld-esp32s3-mit"
          rm -rf "${out}"
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          (cd dist && sha256sum bmo-handheld-esp32s3-mit.tar.gz LICENSE THIRD_PARTY_NOTICES.md > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bmo-handheld-release-bundles
          retention-days: 30
          path: dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            dist/bmo-handheld-esp32s3-mit.tar.gz
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md
            dist/SHA256SUMS.txt
