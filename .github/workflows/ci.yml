name: Firmware and host validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint, guardrails, and links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            hardware/enclosure/requirements.txt

      - name: Install Python verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run fast host validation and static checks
        run: python tasks.py check --no-tests

  host-tests:
    name: Host and WASI unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            hardware/enclosure/requirements.txt

      - name: Install host test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Cache WASI SDK 34
        id: wasi-cache
        uses: actions/cache@v4
        with:
          path: .tools/wasi-sdk-34.0-x86_64-linux
          key: wasi-sdk-34.0-x86_64-linux-b761e3a0

      - name: Download and verify WASI SDK 34
        if: steps.wasi-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools
          curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz -o .tools/wasi-sdk.tar.gz
          echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  .tools/wasi-sdk.tar.gz" | sha256sum -c -
          tar -xzf .tools/wasi-sdk.tar.gz -C .tools
          rm -f .tools/wasi-sdk.tar.gz

      - name: Configure WASI_SDK_PATH
        run: echo "WASI_SDK_PATH=${{ github.workspace }}/.tools/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"

      - name: Run host unit tests
        run: python -m unittest discover -s tests -v

      - name: Run Guardian unit tests
        run: python -m unittest discover -s tools/guardian/tests -v

  firmware-build:
    name: ESP32-S3 firmware profiles and size gate
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt

      - name: Install Python tools
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2.0.0
        with:
          version: 1.6.0

      - name: Cache Arduino cores, libraries, and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
            build
          key: ${{ runner.os }}-arduino-${{ hashFiles('firmware/BmoGameboy/sketch.yaml') }}
          restore-keys: |
            ${{ runner.os }}-arduino-

      - name: Install pinned ESP32 core and libraries from sketch.yaml
        run: python tasks.py setup --no-hooks --no-pip

      - name: Compile default firmware (strict warnings & size check)
        run: |
          python tasks.py build --profile default --warnings strict --fail-on-warnings
          python tasks.py size --elf build/target-compile/BmoGameboy.ino.elf --check-budgets

      - name: Compile opt-out and dormant safety profiles
        run: |
          python tasks.py build --profile no-doom --warnings strict --fail-on-warnings
          python tasks.py build --profile mit --warnings strict --fail-on-warnings
          python tasks.py build --profile audio-compile-only --warnings strict --fail-on-warnings
          python tasks.py build --profile battery-compile-only --warnings strict --fail-on-warnings
          python tasks.py build --profile debug-log-compile-only --warnings strict --fail-on-warnings

      - name: Upload compiled firmware artifacts (default profile)
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware-default
          retention-days: 14
          path: |
            build/target-compile/BmoGameboy.ino.bin
            build/target-compile/BmoGameboy.ino.elf
            build/target-compile/BmoGameboy.ino.map
            build/target-compile/BmoGameboy.ino.bootloader.bin
            build/target-compile/BmoGameboy.ino.partitions.bin
            build/target-compile/partitions.csv
