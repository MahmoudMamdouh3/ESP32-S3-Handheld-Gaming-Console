name: Firmware and host validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint, guardrails, and links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.lock

      - name: Install Python verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock

      - name: Run fast host validation, complexity, cppcheck, and claims checks
        run: |
          python tasks.py check --no-tests --strict-lint
          python -m tools.guardian audit --cppcheck
          lizard -C 25 -L 100 --warnings_only firmware/BmoGameboy/src/app firmware/BmoGameboy/src/hal firmware/BmoGameboy/src/storage firmware/BmoGameboy/src/ui firmware/BmoGameboy/src/cores simulator/simulator.js simulator/bmo_3d_console.js simulator/wasm_playtest_engine.js simulator/js scripts tools/guardian/core tools/tasks tests/host benchmarks
          python scripts/extract_claims.py --fail-on-false

  host-tests:
    name: Host and WASI unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.lock

      - name: Install host test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock

      - name: Cache WASI SDK 34
        id: wasi-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .tools/wasi-sdk-34.0-x86_64-linux
          key: wasi-sdk-34.0-x86_64-linux-b761e3a0

      - name: Download and verify WASI SDK 34
        if: steps.wasi-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools
          curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz -o .tools/wasi-sdk.tar.gz
          echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  .tools/wasi-sdk.tar.gz" | sha256sum -c -
          tar -xzf .tools/wasi-sdk.tar.gz -C .tools
          rm -f .tools/wasi-sdk.tar.gz

      - name: Configure WASI_SDK_PATH
        run: echo "WASI_SDK_PATH=${{ github.workspace }}/.tools/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"

      - name: Run native C++17 CTest suite (Release + ASan/UBSan)
        run: |
          cmake -S . -B build/host-ctest
          cmake --build build/host-ctest --config Release
          ctest --test-dir build/host-ctest -C Release --output-on-failure
          python tasks.py check --no-tests --sanitizers

      - name: Run host unit tests
        run: python -m unittest discover -s tests -v

      - name: Run Guardian unit tests
        run: python -m unittest discover -s tools/guardian/tests -v

      - name: Run host & simulator benchmark budget gate
        run: python tasks.py bench --check

  firmware-build:
    name: ESP32-S3 firmware profiles and size gate
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.lock

      - name: Install Python tools
        run: python -m pip install --disable-pip-version-check -r requirements.lock

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@b82ff2bde1fb8fbbe4abfd3a041cd2ff675dc0dc # v2.0.0
        with:
          version: 1.6.0

      - name: Cache Arduino cores, libraries, and compiler cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
            build
          key: ${{ runner.os }}-arduino-${{ hashFiles('firmware/BmoGameboy/sketch.yaml') }}
          restore-keys: |
            ${{ runner.os }}-arduino-

      - name: Install pinned ESP32 core and libraries from sketch.yaml
        run: python tasks.py setup --no-hooks --no-pip

      - name: Compile default firmware (strict warnings & size check)
        run: |
          python tasks.py build --profile default --warnings strict --fail-on-warnings
          python tasks.py size --elf build/target-compile/BmoGameboy.ino.elf --check-budgets

      - name: Compile opt-out and dormant safety profiles
        run: |
          python tasks.py build --profile no-doom --warnings strict --fail-on-warnings
          python tasks.py build --profile mit --warnings strict --fail-on-warnings
          python tasks.py build --profile audio-compile-only --warnings strict --fail-on-warnings
          python tasks.py build --profile battery-compile-only --warnings strict --fail-on-warnings
          python tasks.py build --profile debug-log-compile-only --warnings strict --fail-on-warnings
          python tasks.py build --profile profiler-compile-only --warnings strict --fail-on-warnings

      - name: Upload redistributable firmware artifacts (MIT profile only; ADR 0008)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: esp32s3-firmware-mit
          retention-days: 14
          path: |
            build/profile-mit/BmoGameboy.ino.bin
            build/profile-mit/BmoGameboy.ino.elf
            build/profile-mit/BmoGameboy.ino.map
            build/profile-mit/BmoGameboy.ino.bootloader.bin
            build/profile-mit/BmoGameboy.ino.partitions.bin
            build/profile-mit/partitions.csv
