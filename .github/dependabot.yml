version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/hardware/enclosure"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      enclosure-pip:
        patterns:
          - "*"
