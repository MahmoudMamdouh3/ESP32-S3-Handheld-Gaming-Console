[project]
name = "bmo-handheld-tools"
version = "0.1.0"
description = "Host tests, firmware validation tooling, browser simulator server, and enclosure CAD scripts for the BMO ESP32-S3 handheld."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow==12.2.0",
    "manifold3d==3.0.1",
    "numpy==2.2.6",
    "trimesh==5.2.1",
]

[project.optional-dependencies]
dev = [
    "clang-tidy==22.1.8",
    "cppcheck==1.5.1",
    "lizard>=1.17.13,<2.0.0",
    "mypy>=1.14.0,<3.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "Book",
    "firmware/BmoGameboy/src/third_party",
    "build",
    "games",
    "roms",
    "sdcard",
    ".tools",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90", "PERF", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_configs = true
exclude = [
    "Book/",
    "build/",
    "games/",
    "roms/",
    "sdcard/",
    "firmware/BmoGameboy/src/third_party/",
]
