    :root {
      --bg: #0D1619;
      --card: #142428;
      --border: #264B42;
      --accent: #5FB49C;
      --gold: #FFE033;
      --text: #E0F2F1;
      --text-muted: #80CBC4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #header {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(20, 36, 40, 0.9);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      backdrop-filter: blur(8px);
      z-index: 10;
      max-width: 380px;
    }
    #header h1 {
      font-size: 18px;
      color: var(--gold);
      margin-bottom: 4px;
    }
    #header p {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .back-btn {
      display: inline-block;
      background: var(--accent);
      color: #051B17;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    #tooltip {
      position: absolute;
      display: none;
      background: var(--card);
      border: 1px solid var(--gold);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--text);
      pointer-events: none;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    svg { width: 100%; height: 100%; cursor: grab; }
    svg:active { cursor: grabbing; }
    .link { stroke: #264B42; stroke-opacity: 0.6; stroke-width: 1.2px; }
    .node { stroke: #E0F2F1; stroke-width: 1px; cursor: pointer; }
    .node:hover { stroke: var(--gold); stroke-width: 2.5px; }
    .label { fill: #80CBC4; font-size: 10px; pointer-events: none; text-shadow: 0 1px 3px #000; }
  </style>
</head>

    <a href="../index.html" class="back-btn">Back to Hub</a>
  </div>

    const svg = d3.select("#canvas");
    const width = window.innerWidth;
    const height = window.innerHeight;

    const g = svg.append("g");

    svg.call(d3.zoom()
      .scaleExtent([0.2, 5])
      .on("zoom", (event) => g.attr("transform", event.transform))
    );

    const simulation = d3.forceSimulation(data.nodes)
      .force("link", d3.forceLink(data.links).id(d => d.id).distance(55))
      .force("charge", d3.forceManyBody().strength(-140))
      .force("center", d3.forceCenter(width / 2, height / 2))
      .force("collision", d3.forceCollide().radius(d => d.radius + 6));

    const link = g.append("g")
      .selectAll(".link")
      .data(data.links)
      .join("line")
      .attr("class", "link");

    const tooltip = document.getElementById("tooltip");

    const node = g.append("g")
      .selectAll(".node")
      .data(data.nodes)
      .join("circle")
      .attr("class", "node")
      .attr("r", d => d.radius)
      .attr("fill", d => d.color)
      .call(d3.drag()
        .on("start", (event, d) => {
          if (!event.active) simulation.alphaTarget(0.3).restart();
          d.fx = d.x; d.fy = d.y;
        })
        .on("drag", (event, d) => {
          d.fx = event.x; d.fy = event.y;
        })
        .on("end", (event, d) => {
          if (!event.active) simulation.alphaTarget(0);
          d.fx = null; d.fy = null;
        })
      )
      .on("mouseover", (event, d) => {
        tooltip.style.display = "block";
        tooltip.innerHTML = `<strong>${d.id}</strong><br>Category: ${d.category}<br>Lines: ${d.lines}<br><span style="color:#5FB49C">${d.path}</span>`;
      })
      .on("mousemove", (event) => {
        tooltip.style.left = (event.pageX + 12) + "px";
        tooltip.style.top = (event.pageY - 12) + "px";
      })
      .on("mouseout", () => {
        tooltip.style.display = "none";
      });

    const label = g.append("g")
      .selectAll(".label")
      .data(data.nodes.filter(d => d.radius > 9))
      .join("text")
      .attr("class", "label")
      .text(d => d.id)
      .attr("dx", d => d.radius + 3)
      .attr("dy", 3);

    simulation.on("tick", () => {
      link
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);

      node
        .attr("cx", d => d.x)
        .attr("cy", d => d.y);

      label
        .attr("x", d => d.x)
        .attr("y", d => d.y);
    });
