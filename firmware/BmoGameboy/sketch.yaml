default_profile: esp32s3

profiles:
  esp32s3:
    notes: ESP32-S3-N16R8 release build with the repository partition table.
    fqbn: esp32:esp32:esp32s3:CDCOnBoot=cdc,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=custom,PSRAM=opi,USBMode=default
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - Adafruit BusIO (1.17.4)
      - Adafruit GFX Library (1.12.6)
      - Adafruit ST7735 and ST7789 Library (1.11.0)
